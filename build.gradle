plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The jar is seedtocellar-<Minecraft version>-<mod version>.jar, so players see which game it's for.
version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to players from 26.1 on, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include resources generated by data generators (but not the generator's cache).
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

// Integrations whose mods aren't on this Minecraft version yet are parked: their code stays in the repository but is
// left out of the build until the mod catches up (PROGRESS.md lists them). Patchouli's book generator, The One Probe,
// and the recipes and files for Create, Mekanism, Immersive Engineering, Botany Pots, Farmer's Delight, Tough As Nails
// and Cold Sweat.
def parked = [
        'compat/top/**',                    // The One Probe
        'datagen/ModBookProvider.java',     // Patchouli: The Brewer's Almanac
        'datagen/CompatRecipes.java',       // Create, Mekanism, IE, Botany Pots and Farmer's Delight recipes
        'datagen/ModCompatDataProvider.java', // Cold Sweat
        'gametest/CompatTests.java',        // the integrations' tests (the vanilla recipe-clash scan is in RecipeClashTests)
]
// PORT (temporary): left out of the build until their batch of the 26.3 port (docs/PORT_26.3.md).
def notYetPorted = [
        'devtools/**',
]
sourceSets.main.java {
    (parked + notYetPorted).each { exclude "io/github/spencerharris192/${mod_id}/${it}" }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // gradlew runClient -PquickPlay=<save name> jumps straight into that world (used for automated checks).
            if (project.hasProperty('quickPlay')) programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            // gradlew runClient -Ptour: the store-page photo tour (tools/make_showcase.py, devtools/ScreenshotTour) in a
            // 1920x1080 window, in the world run/saves/showcase
            if (project.hasProperty('tour')) {
                systemProperty 'seedtocellar.tour', file('run/showcase_tour.json').absolutePath
                programArguments.addAll '--quickPlaySingleplayer', 'showcase', '--width', '1920', '--height', '1080'
            }
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // Launches a dedicated GameTest server, runs every registered test, then exits.
        // This doubles as our "does the mod load on a dedicated server?" check.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // Data generation. Writes generated JSON to src/generated/resources and
        // runs the asset audit (fails if any item/block is missing assets).
        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// GameTests speed things up by changing our synced (server) config, and NeoForge writes each change straight to its
// file; a run that stops mid-write leaves it cut short. Every run starts from the defaults instead.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete "run-gametest/config/${mod_id}-server.toml" }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // a small library the JEI API depends on
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// localRuntime: mods present in the dev game only. Never a dependency of the published mod.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Optional integrations: compiled against, never required. Players don't need them.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:serene-seasons:${serene_seasons_version}"
    compileOnly "maven.modrinth:glitchcore:${glitchcore_version}"   // Serene Seasons' config is built on it
}

// -PwithCompat: also load the mods Seed to Cellar integrates with in the dev runs, to test our integrations with them
// (GDD section 22). Never part of the built jar; players don't need any of them.
if (project.hasProperty('withCompat')) {
    dependencies {
        localRuntime "maven.modrinth:serene-seasons:${serene_seasons_version}"
        localRuntime "maven.modrinth:glitchcore:${glitchcore_version}"
    }
}

// Expands ${...} properties in neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "${it}_${mod_id}" } }   // the MIT license travels with the mod
    // Players don't need our GameTests, their empty test templates or the dev tools.
    exclude "io/github/spencerharris192/${mod_id}/gametest/**"
    exclude "io/github/spencerharris192/${mod_id}/devtools/**"
    exclude "data/${mod_id}/structure/empty*.nbt"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
