plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

// The jar is seedtocellar-<Minecraft version>-<mod version>.jar, so players see which game it's for.
version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // Parchment names (see gradle.properties). Re-run setup after changing.
    mappings channel: mapping_channel, version: mapping_version

    // Required for resources to be visible when launching from an IDE.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Lets other mods' mixins (e.g. Jade's) find their targets in the dev game.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // gradlew runClient -PquickPlay=<save name> jumps straight into that world (used for automated checks).
            if (project.hasProperty('quickPlay')) args '--quickPlaySingleplayer', project.property('quickPlay')
            // gradlew runClient -Ptour: the store-page photo tour (tools/make_showcase.py, devtools/ScreenshotTour) in a
            // 1920x1080 window, in the world run/saves/showcase
            if (project.hasProperty('tour')) {
                property 'seedtocellar.tour', file('run/showcase_tour.json').absolutePath
                args '--quickPlaySingleplayer', 'showcase', '--width', '1920', '--height', '1080'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Launches a dedicated GameTest server, runs every registered test, then exits.
        // This doubles as our "does the mod load on a dedicated server?" check.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // Data generation. Writes generated JSON to src/generated/resources and
        // runs the asset audit (fails if any item/block is missing assets).
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// GameTests speed things up by changing our server config, and Forge writes each change straight to the test world's
// file; a run that stops mid-write leaves it cut short. Every run starts from the defaults instead.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete "run-gametest/world/serverconfig/${mod_id}-server.toml" }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config' // a small library the JEI API depends on
        }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional integrations: compiled against, never required. Players don't need them.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    compileOnly fg.deobf("maven.modrinth:the-one-probe:${top_version}")
    compileOnly fg.deobf("maven.modrinth:serene-seasons:${serene_seasons_version}")
    compileOnly fg.deobf("maven.modrinth:glitchcore:0.0.1.1")   // Serene Seasons' config is built on it
}

// Expands ${...} properties in mods.toml and pack.mcmeta.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "${it}_${mod_id}" } }   // the MIT license travels with the mod
    // Players don't need our GameTests, their empty test templates, the dev tools or the data generator's cache.
    exclude "io/github/spencerharris192/${mod_id}/gametest/**"
    exclude "io/github/spencerharris192/${mod_id}/devtools/**"
    exclude "data/${mod_id}/structures/empty*.nbt"
    exclude '.cache/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// -PwithCompat: also load the mods Seed to Cellar integrates with in the dev runs, to test our recipes for their
// machines (GDD section 22). -PwithPatchouli loads just Patchouli (to read The Brewer's Almanac in the dev client).
// Never part of the built jar; players don't need any of them.
if (project.hasProperty('withCompat')) {
    dependencies {
        runtimeOnly fg.deobf("maven.modrinth:mekanism:10.4.16.80")
        runtimeOnly fg.deobf("maven.modrinth:immersiveengineering:10.2.0-183")
        runtimeOnly fg.deobf("maven.modrinth:botany-pots:13.0.43")
        runtimeOnly fg.deobf("maven.modrinth:bookshelf-lib:20.2.15")
        runtimeOnly fg.deobf("maven.modrinth:create:mc1.20.1-6.0.8")
        runtimeOnly fg.deobf("maven.modrinth:the-one-probe:${top_version}")
        runtimeOnly fg.deobf("maven.modrinth:serene-seasons:${serene_seasons_version}")
        runtimeOnly fg.deobf("maven.modrinth:glitchcore:0.0.1.1")
        runtimeOnly fg.deobf("maven.modrinth:tough-as-nails:9.2.0.171")
        runtimeOnly fg.deobf("maven.modrinth:cold-sweat:2.4.3.2")
        // Popular mods with recipes near ours, loaded to check that none of our recipes clashes with theirs
        runtimeOnly fg.deobf("maven.modrinth:farmers-delight:1.20.1-1.3.4")
        runtimeOnly fg.deobf("maven.modrinth:quark:1.20.1-4.0-462")
        runtimeOnly fg.deobf("maven.modrinth:zeta:1.20.1-1.0-31")
        runtimeOnly fg.deobf("maven.modrinth:supplementaries:1.20-3.1.43-forge")
        runtimeOnly fg.deobf("maven.modrinth:moonlight:1.20-2.16.35-forge")
    }
}
if (project.hasProperty('withCompat') || project.hasProperty('withPatchouli')) {
    dependencies {
        runtimeOnly fg.deobf("maven.modrinth:patchouli:1.20.1-85-forge")
    }
}
