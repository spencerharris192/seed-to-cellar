# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# We build against Forge's "recommended" (stable) 1.20.1 build.
forge_version=47.4.10
# Players may run any Forge 47.x build.
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# Parchment: community parameter names and javadocs layered on top of Mojang's official names.
# See https://parchmentmc.org/docs/getting-started
mapping_channel=parchment
mapping_version=2023.09.03-1.20.1


## Optional integrations (compile against their APIs; present only in the dev game for testing)
jei_version=15.62.0.216
jade_version=11.13.3+forge
top_version=1.20.1-10.0.4
serene_seasons_version=9.1.0.3


## Mod Properties

# The mod ID is permanent. Never change it after release.
mod_id=seedtocellar
mod_name=Seed to Cellar
# License is still to be decided before the first public release (see PROGRESS.md).
mod_license=MIT
mod_version=1.0.0
# Must match the base Java package of the mod sources.
mod_group_id=io.github.spencerharris192.seedtocellar
mod_authors=Mebb
mod_description=Find wild plants, grow 30 crops and 8 fruit trees, and turn one farm into a web of foods and drinks: bread and stews, beer and wine, cider and mead, whiskey, brandy, rum and gin aging in casks in your cellar. Quality stars, climates, fermentation temperature, villagers, a tavern to pour it all in, and The Brewer's Almanac to guide you.
