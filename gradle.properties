# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true


## Environment Properties

minecraft_version=26.3
minecraft_version_range=[26.3]
# NeoForge (the mod loader). Players may run this build or any later one for 26.3.
neo_version=26.3.0.52-beta
neo_version_range=[26.3.0.52-beta,)


## Optional integrations (compile against their APIs; present only in the dev game for testing)
jei_version=31.9.0.58
jade_version=26.3.5+neoforge
# Modrinth version IDs (their version numbers are shared across loaders)
serene_seasons_version=QnvW5HPm
glitchcore_version=5FMzBcg1


## Mod Properties

# The mod ID is permanent. Never change it after release.
mod_id=seedtocellar
mod_name=Seed to Cellar
mod_license=MIT
mod_version=1.1.0
# Must match the base Java package of the mod sources.
mod_group_id=io.github.spencerharris192.seedtocellar
mod_authors=Mebb
mod_description=Find wild plants, grow 30 crops and 8 fruit trees, and turn one farm into a web of foods and drinks: bread and stews, beer and wine, cider and mead, whiskey, brandy, rum and gin aging in casks in your cellar. Quality stars, climates, fermentation temperature, villagers, and a tavern to pour it all in.
